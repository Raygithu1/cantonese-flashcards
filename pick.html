<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Listen &amp; pick 聽一聽 — Gong Gong 講講</title>
  <meta name="description" content="A no-score Cantonese listening game for toddlers: hear a word, then pick the matching picture from two cheerful cards. Practise animals, vehicles, food, colours, body parts, family and actions.">
  <meta name="theme-color" content="#FFF6E9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%23FF6B5B'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23FFF6E9' font-family='serif'%3E講%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&text=%E4%B8%80%E4%B8%83%E4%B8%89%E4%B9%9D%E4%BA%8C%E4%BA%94%E4%BA%BA%E4%BB%94%E4%BD%9C%E5%85%94%E5%85%AB%E5%85%AD%E5%88%B7%E5%8B%95%E5%8D%81%E5%8D%A1%E5%8F%8B%E5%8F%94%E5%8F%A3%E5%93%A5%E5%94%B1%E5%95%A1%E5%95%A4%E5%96%AE%E5%9B%9B%E5%A3%AB%E5%A4%9A%E5%A7%90%E5%A7%A8%E5%A9%86%E5%AA%BD%E5%AD%90%E5%AE%B6%E5%AF%B6%E5%B0%8F%E5%B7%B4%E5%BC%9F%E5%BF%83%E6%89%8B%E6%8A%B1%E6%8B%8D%E6%8F%90%E6%95%91%E6%9C%8B%E6%9E%9C%E6%A2%A8%E6%A9%99%E6%A9%9F%E6%AD%8C%E6%B4%97%E6%B6%88%E7%81%AB%E7%81%B0%E7%88%B8%E7%88%BA%E7%89%99%E7%89%9B%E7%8B%97%E7%93%9C%E7%94%9F%E7%95%AA%E7%99%BD%E7%9A%84%E7%9C%BC%E7%9E%93%E7%B1%B3%E7%B2%89%E7%B2%9F%E7%B4%85%E7%B4%AB%E7%B6%A0%E7%BE%8A%E8%80%B3%E8%82%9A%E8%85%A6%E8%85%B3%E8%88%9E%E8%88%B9%E8%89%B2%E8%8A%B1%E8%8C%84%E8%8F%9C%E8%94%94%E8%95%89%E8%96%AF%E8%97%8D%E8%98%8B%E8%98%AD%E8%98%BF%E8%A1%8C%E8%A5%BF%E8%AC%9B%E8%AD%A6%E8%AD%B7%E8%B1%A1%E8%B1%AC%E8%B2%93%E8%B2%A8%E8%B7%91%E8%B7%B3%E8%BB%8A%E9%87%91%E9%98%B2%E9%9A%A8%E9%9B%80%E9%9B%9E%E9%A0%AD%E9%A3%9B%E9%A3%9F%E9%A3%B2%E9%A6%99%E9%A6%AC%E9%AB%AE%E9%AD%9A%E9%B4%A8%E9%BB%83%E9%BB%91%E9%BC%BB&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css?v=13">
</head>
<body class="deck-page pick-page">

  <div class="sky sky--deck" aria-hidden="true">
    <span class="blob blob--coral"></span>
    <span class="blob blob--teal"></span>
    <span class="blob blob--sun"></span>
  </div>

  <header class="deck-header">
    <a class="brand brand--compact" href="index.html">
      <span class="brand__mark brand__mark--small" aria-hidden="true">講</span>
      <span class="brand__text"><span class="brand__name">Gong Gong</span></span>
    </a>
    <h1 class="deck-header__title">Listen &amp; pick <span lang="yue">聽一聽</span></h1>
    <div class="deck-header__tools">
      <a class="icon-btn" href="index.html" aria-label="Home">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
      </a>
    </div>
  </header>

  <main class="pick-main">
    <section class="pick-intro" aria-labelledby="pickTitle">
      <p class="eyebrow"><span class="eyebrow__dot eyebrow__dot--sun"></span> Listening game</p>
      <h2 id="pickTitle">Which one is it?</h2>
      <p class="pick-intro__lead">Listen in Cantonese, then tap the picture that matches.</p>
    </section>

    <button class="say-btn pick-hear" id="hearBtn" type="button">
      <span class="say-btn__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
      </span>
      <span class="say-btn__text">Hear it again<small>tap to hear the word</small></span>
      <span class="say-btn__wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    </button>

    <div class="pick-board" id="pickBoard" role="group" aria-label="Choose the picture that matches the Cantonese word"></div>

    <p class="pick-feedback" id="pickFeedback" role="status" aria-live="polite">Listen, then tap the picture that matches.</p>

    <div class="pick-bar">
      <button class="btn btn--primary btn--xl" id="newPairBtn" type="button">
        <span class="btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" stroke="none"><path d="M12 2.6l2.4 6.9 7 2.5-7 2.5-2.4 6.9-2.4-6.9-7-2.5 7-2.5z"/></svg>
        </span>
        New pair
      </button>
    </div>

    <p class="pick-footnote">No scores, no rush — play as long as you like. Press <kbd>1</kbd> or <kbd>2</kbd> to choose, or <kbd>H</kbd> to hear it again.</p>
    <p class="voice-note" id="voiceNote" hidden></p>
  </main>

  <script>
    /* Collect each picture deck as it loads, then let the game pick from them. */
    window.__GONG_GONG_DECKS = [];
    Object.defineProperty(window, "GONG_GONG_DECK", {
      configurable: true,
      set: function (value) {
        if (value && value.items && value.items.length) {
          window.__GONG_GONG_DECKS.push(value);
        }
      }
    });
  </script>
  <script src="assets/decks/animals.js?v=13" defer></script>
  <script src="assets/decks/vehicles.js?v=13" defer></script>
  <script src="assets/decks/food.js?v=13" defer></script>
  <script src="assets/decks/colours.js?v=13" defer></script>
  <script src="assets/decks/body.js?v=13" defer></script>
  <script src="assets/decks/family.js?v=13" defer></script>
  <script src="assets/decks/actions.js?v=13" defer></script>
  <script src="assets/pick.js?v=13" defer></script>
</body>
</html>
